services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5434:5432"
    mem_limit: 300m
    volumes:
      - filesystem:/var/lib/postgresql/data
volumes:
  filesystem:
